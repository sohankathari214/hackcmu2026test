[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glucopilot"
version = "0.1.0"
description = "Personalized Type 1 diabetes glucose forecasting prototype"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "lightgbm>=4.0.0",
  "pydantic>=2.7.0",
  "joblib>=1.3.0",
  "scipy>=1.11.0",
  "PyYAML>=6.0.0",
  "fastapi>=0.109.0",
  "uvicorn>=0.27.0",
  "matplotlib>=3.7.0",
  "pytest>=8.0.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
